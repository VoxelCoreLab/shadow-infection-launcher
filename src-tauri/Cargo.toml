[package]
name = "shadow-infection-launcher"
version = "0.1.0"
description = "Shadow Infection Launcher"
authors = ["Voxel Core Lab"]
edition = "2021"

[lib]
name = "shadow_infection_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
